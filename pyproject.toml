[project]
name = "footpalm"
version = "0.1.0"
description = "Opponent-adjusted EPA ratings for college football"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "networkx>=3.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "tabpfn>=7.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
footpalm = "footpalm.build:main"
footpalm-project = "footpalm.project:main"
footpalm-score = "footpalm.score:main"
footpalm-cron = "footpalm.cron:main"
footpalm-ask = "footpalm.ask:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["footpalm"]
